<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MinIO HLS Streaming POC</title>
  </head>

  <body>
    <h2>Adaptive Streaming POC</h2>

    <label>Video:</label>
    <select id="video-name">
      <option value="sample">Sample</option>
      <option value="outing">Outing</option>
    </select>

    <br /><br />

    <label>Quality:</label>
    <select id="quality">
      <option value="-1">Auto</option>
    </select>

    <br /><br />

    <video id="video" controls width="800" height="500"></video>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <script>
      const video = document.getElementById("video");

      const qualitySelect = document.getElementById("quality");

      const videoSelect = document.getElementById("video-name");

      // local POC only
      const SECRET = "mysecret";
      const UID = "42";

      let hls = null;

      function generateToken(uri, uid) {
        const expires = Math.floor(Date.now() / 1000) + 3600;

        // prefix path
        // /hls/sample
        const match = uri.match(/^\/hls\/[^/]+/);

        const securePath = match ? match[0] : uri;

        const raw = `${expires}${securePath}${uid} ${SECRET}`;

        const md5 = CryptoJS.MD5(raw);

        const token = CryptoJS.enc.Base64.stringify(md5)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");

        return {
          token,
          expires,
        };
      }

      function loadVideo(videoName) {
        // destroy previous player
        if (hls) {
          hls.destroy();
          hls = null;
        }

        qualitySelect.innerHTML = '<option value="-1">Auto</option>';

        const uri = `/hls/processed/${videoName}/master.m3u8`;

        const { token, expires } = generateToken(uri, UID);

        const urlParams = `uid=${UID}&md5=${token}&expires=${expires}`;

        const videoUrl = `http://localhost:8084${uri}?${urlParams}`;

        console.log("videoUrl=", videoUrl);

        if (Hls.isSupported()) {
          hls = new Hls({
            debug: false,
          });

          // append auth to ALL requests
          hls.config.xhrSetup = function (xhr, url) {
            const separator = url.includes("?") ? "&" : "?";

            xhr.open("GET", url + separator + urlParams, true);

            console.log("HLS request ->", url + separator + urlParams);
          };

          hls.loadSource(videoUrl);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            console.log("Manifest loaded");

            hls.levels.forEach((level, index) => {
              const option = document.createElement("option");

              option.value = index;

              option.text =
                `${level.height}p ` +
                `(${Math.round(level.bitrate / 1000)} kbps)`;

              qualitySelect.appendChild(option);
            });

            video.muted = true;
            video.play();
          });

          qualitySelect.onchange = function () {
            const selected = parseInt(this.value);

            if (selected === -1) {
              hls.currentLevel = -1;
            } else {
              hls.currentLevel = selected;
            }
          };

          hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
            const level = hls.levels[data.level];

            console.log("Switched ->", level.height + "p");
          });

          hls.on(Hls.Events.ERROR, (_, data) => {
            console.error("HLS error:", data);
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = videoUrl;
        }
      }

      // initial load
      loadVideo(videoSelect.value);

      // reload on change
      videoSelect.addEventListener("change", function () {
        console.log("Switching ->", this.value);

        loadVideo(this.value);
      });
    </script>
  </body>
</html>
